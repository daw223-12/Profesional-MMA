<VirtualHost *:80>
	ServerName professionalmma.ddnsking.com
	Alias /api /var/www/html/mma-api/public/index.php/api
	DocumentRoot /var/www/html/professionalmma-front	

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined 

	<Directory "/var/www/html/professionalmma-front">
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>
</VirtualHost>
<VirtualHost *:443>
	ServerName professionalmma.ddns.net
	Alias /api /var/www/html/mma-api/public/index.php/api
	DocumentRoot /var/www/html/professionalmma-front	


        SSLEngine on
        SSLCertificateFile /etc/apache2/certs/fullchain.pem
        SSLCertificateKeyFile /etc/apache2/certs/privkey.pem

	ErrorLog ${APACHE_LOG_DIR}/error-https.log
	CustomLog ${APACHE_LOG_DIR}/access-https.log combined 

	<Directory "/var/www/html/professionalmma-front">
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
        </Directory>
</VirtualHost>
